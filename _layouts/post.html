---
layout: default
---
<article class="wrap">
  <div class="post-header">
    <span class="eyebrow">Dispatch</span>
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%-d %B %Y" }}</p>
  </div>

  <div class="post-body">
    {{ content }}
  </div>

  <div class="post-footer-nav">
    <a href="/dispatches/">&larr; All dispatches</a>
  </div>
</article>

<div class="subscribe-section wrap">
  <span class="eyebrow">Subscribe</span>
  <h2>Subscribe to The Oslo Review</h2>
  <!-- TODO — replace YOUR-BUTTONDOWN-USERNAME below with your real Buttondown username. -->
  <form action="https://buttondown.com/api/emails/embed-subscribe/YOUR-BUTTONDOWN-USERNAME" method="post" class="subscribe-form">
    <label for="bd-email-post" class="sr-only">Email address</label>
    <input type="email" id="bd-email-post" name="email" placeholder="you@example.com" required autocomplete="email">
    <input type="hidden" name="embed" value="1">
    <input type="submit" value="Subscribe">
    <p class="powered-by"><a href="https://buttondown.com" target="_blank" rel="noopener">Powered by Buttondown</a></p>
  </form>
</div>

<div class="comments-section wrap">
  <span class="eyebrow">Discussion</span>

  <!--
    TODO — this is a placeholder. Once you've enabled Discussions on
    your GitHub repo and set up the giscus app at https://giscus.app,
    that page will generate the real values for the four data-* fields
    below (data-repo, data-repo-id, data-category, data-category-id).
    Copy them in exactly as given — these placeholders won't work.
  -->
  <script src="https://giscus.app/client.js"
    data-repo="YOUR-GITHUB-USERNAME/YOUR-REPO-NAME"
    data-repo-id="TODO-FROM-GISCUS.APP"
    data-category="Comments"
    data-category-id="TODO-FROM-GISCUS.APP"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="dark_dimmed"
    data-lang="en"
    crossorigin="anonymous"
    async>
  </script>
</div>
