---
layout: default
title: Essays
---
<div class="wrap">
  <div class="post-header">
    <span class="eyebrow">Writing</span>
    <h1>Essays</h1>
    <p class="post-meta">On statistics, literature, history, and culture.</p>
  </div>

  <ul class="essay-list">
    {% for post in site.posts %}
    <li>
      <a href="{{ post.url }}">
        <span class="essay-title">{{ post.title }}</span>
        <span class="essay-meta">{{ post.date | date: "%-d %B %Y" }}</span>
        {% if post.excerpt %}<span class="essay-excerpt">{{ post.excerpt | strip_html | truncate: 160 }}</span>{% endif %}
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
